<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>FEED-ME 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: copied verbatim from app/globals.css ── */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    /* Inter / Geist (next/font) replaced with a system stack */
    --font: Inter, "Pretendard", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* ── product ── */
  .app { position: relative; max-width: 680px; margin: 0 auto; padding: 56px 0 48px; font-size: 14px }
  .theme-btn { position: absolute; top: 12px; right: 0 }
  .hero h1 { margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1 }
  .hero p { margin: 10px 0 0; color: var(--muted-foreground); font-size: 15px }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: calc(var(--radius) * .8); border: 1px solid transparent; font: 500 13px var(--font); cursor: pointer; white-space: nowrap; background: transparent; color: var(--foreground) }
  .btn svg { width: 15px; height: 15px; flex: none }
  .btn-ghost:hover { background: var(--accent) }
  .btn-icon { width: 32px; padding: 0 }
  .btn:disabled { opacity: .5; pointer-events: none }
  .btn:focus-visible, .input:focus-visible, .menu-item:focus-visible, .chip:focus-visible, .prompt-toggle:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 0 }

  .url-box { margin-top: 32px; display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 6px 0 4px; border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.2); background: var(--background) }
  .url-box:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent) }
  .url-box[data-invalid] { border-color: var(--destructive) }
  .input { flex: 1; min-width: 0; height: 100%; padding: 0 8px; border: 0; background: transparent; color: var(--foreground); font: 14px var(--font); outline: none }
  .input::placeholder { color: var(--muted-foreground) }
  .vsep { width: 1px; height: 20px; background: var(--border); margin: 0 4px }
  .submit { width: 30px; height: 30px; border-radius: calc(var(--radius) * .8); border: 0; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; cursor: pointer }
  .submit svg { width: 16px; height: 16px }
  .submit:disabled { opacity: .6; cursor: default }
  .field-error { margin: 8px 0 0; color: var(--destructive); font-size: 13px }
  .spin { animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }

  .rule { border: 0; border-top: 1px solid var(--border); margin: 32px 0 }

  .empty { color: var(--muted-foreground); text-align: center; padding: 24px 0; line-height: 1.7 }
  .empty b { display: block; color: var(--foreground); font-weight: 500 }

  .alert { display: grid; grid-template-columns: 18px 1fr; gap: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; color: var(--destructive) }
  .alert svg { width: 18px; height: 18px; margin-top: 1px }
  .alert-title { font-weight: 500 }
  .alert-desc { grid-column: 2; color: var(--muted-foreground); line-height: 1.55 }

  .skeleton { background: var(--muted); border-radius: calc(var(--radius) * .6); animation: pulse 1.6s ease-in-out infinite }
  @keyframes pulse { 50% { opacity: .5 } }

  .r-title { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; word-break: keep-all; overflow-wrap: anywhere }
  .r-by { margin: 8px 0 0; color: var(--muted-foreground); font-size: 14px }
  .r-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 4px }
  .r-actions .split { order: -1; align-self: flex-end }
  .r-actions .prompt-toggle { align-self: flex-start }
  .prompt-toggle { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px; margin-left: -6px; border: 0; border-radius: calc(var(--radius) * .6); background: transparent; color: var(--muted-foreground); font: 13px var(--font); cursor: pointer }
  .prompt-toggle:hover { color: var(--foreground); background: var(--accent) }
  .prompt-toggle svg { width: 14px; height: 14px }
  .prompt-toggle .chev { transition: transform .15s }
  .prompt-toggle[aria-expanded="true"] .chev { transform: rotate(90deg) }
  .prompt-toggle .chosen { color: var(--foreground); font-weight: 500 }

  .split { position: relative; display: inline-flex; border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); background: var(--background); margin-left: auto }
  .split .btn { border-radius: 0; height: 30px }
  .split .btn:first-child { border-radius: calc(var(--radius) * .8) 0 0 calc(var(--radius) * .8) }
  .split .btn:last-child { border-left: 1px solid var(--border); border-radius: 0 calc(var(--radius) * .8) calc(var(--radius) * .8) 0; width: 30px; padding: 0 }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 190px; padding: 4px; border: 1px solid var(--border); border-radius: calc(var(--radius) * .9); background: var(--popover); color: var(--popover-foreground); box-shadow: 0 8px 24px oklch(0 0 0 / 10%) }
  .menu-item { display: flex; width: 100%; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: calc(var(--radius) * .6); background: transparent; color: inherit; font: 13.5px var(--font); text-align: left; cursor: pointer }
  .menu-item:hover, .menu-item:focus-visible { background: var(--accent) }
  .menu-item svg { width: 16px; height: 16px; flex: none }

  .prompts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
  .chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font: 13px var(--font); cursor: pointer }
  .chip:hover { background: var(--accent) }
  .chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary) }
  .custom-prompt { width: 100%; height: 36px; margin-top: 8px; padding: 0 12px; border: 1px solid var(--input); border-radius: calc(var(--radius) * .8); background: transparent; color: var(--foreground); font: 13.5px var(--font) }
  .custom-prompt::placeholder { color: var(--muted-foreground) }
  .custom-prompt:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent) }

  .md { line-height: 1.8; font-size: 15.5px; overflow-wrap: anywhere }
  .md > :first-child { margin-top: 0 }
  .md h2 { font-size: 22px; margin: 32px 0 12px; letter-spacing: -0.015em; line-height: 1.4 }
  .md h3 { font-size: 17px; margin: 24px 0 8px }
  .md p { margin: 0 0 16px }
  .md ul, .md ol { margin: 0 0 16px; padding-left: 22px }
  .md li { margin: 4px 0 }
  .md a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--muted-foreground) }
  .md code { font: 13px var(--mono); background: var(--muted); padding: 2px 5px; border-radius: 4px }
  .md pre { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 0 0 16px }
  .md pre code { background: none; padding: 0; line-height: 1.6 }
  .md blockquote { margin: 0 0 16px; padding: 2px 0 2px 14px; border-left: 3px solid var(--border); color: var(--muted-foreground) }
  .md table { border-collapse: collapse; margin: 0 0 16px; font-size: 14px; display: block; overflow-x: auto }
  .md th, .md td { border: 1px solid var(--border); padding: 7px 12px; text-align: left }
  .md th { background: var(--muted); font-weight: 600 }

  .toaster { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(400px, calc(100vw - 32px)) }
  .toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: 0 8px 24px oklch(0 0 0 / 12%); font-size: 13.5px; line-height: 1.5; animation: rise .2s ease-out }
  .toast svg { width: 16px; height: 16px; flex: none; margin-top: 2px }
  .toast.error svg { color: var(--destructive) }
  .toast b { display: block; font-weight: 600 }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } }

  /* narrow */
  .sh-vp-390 .app { padding-top: 48px }
  .sh-vp-390 .hero h1 { font-size: 36px }
  .sh-vp-390 .r-title { font-size: 21px }
  .sh-vp-390 .toaster { position: sticky; bottom: 8px; left: auto; transform: none; width: 100% }
  @media (max-width: 560px) {
    .hero h1 { font-size: 36px }
    .r-title { font-size: 21px }
  }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="converter" data-title="변환기" data-states="변환 결과,긴 본문 결과,가져오기 실패">
    <div class="app">
      <button class="btn btn-ghost btn-icon theme-btn" id="themeBtn" data-component="Button" aria-label="다크 모드로 전환" title="테마 전환">
        <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg id="icoSun" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>

      <header class="hero">
        <h1>FEED-ME</h1>
        <p>어떤 URL이든, Markdown으로.</p>
      </header>

      <form id="form" novalidate data-component="new:UrlForm">
        <div class="url-box" id="urlBox" data-component="InputGroup">
          <input class="input" id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://..." aria-label="변환할 URL" aria-describedby="urlErr" data-component="InputGroupInput">
          <button type="button" class="btn btn-ghost btn-icon" id="clearBtn" aria-label="지우기" hidden data-component="InputGroupButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <span class="vsep"></span>
          <button class="submit" id="convertBtn" type="submit" aria-label="변환" data-component="InputGroupButton">
            <svg id="icoArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <svg id="spin" class="spin" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>
          </button>
        </div>
        <p class="field-error" id="urlErr" hidden>http:// 또는 https://로 시작하는 웹 페이지 주소를 입력해 주세요.</p>
      </form>

      <hr class="rule">

      <!-- idle -->
      <div class="empty" id="idle" data-component="Empty">
        <b>변환한 페이지가 여기에 나타납니다</b>
        블로그 글, 문서, 뉴스 기사 주소를 붙여넣어 보세요.
      </div>

      <!-- loading -->
      <div id="loading" hidden aria-busy="true" data-component="Skeleton" style="display:flex;flex-direction:column;gap:12px">
        <div class="skeleton" style="height:30px;width:80%"></div>
        <div class="skeleton" style="height:16px;width:22%"></div>
        <div style="height:24px"></div>
        <div class="skeleton" style="height:14px"></div>
        <div class="skeleton" style="height:14px;width:92%"></div>
        <div class="skeleton" style="height:14px;width:84%"></div>
      </div>

      <!-- error -->
      <div class="alert" id="error" role="alert" hidden data-component="Alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <div class="alert-title" id="errTitle"></div>
        <div class="alert-desc" id="errDesc"></div>
      </div>

      <!-- result -->
      <article id="result" hidden>
        <header data-component="new:ResultHeader">
          <h2 class="r-title" id="rTitle"></h2>
          <p class="r-by" id="rBy"></p>

          <div class="r-actions">
            <button type="button" class="prompt-toggle" id="promptToggle" aria-expanded="false" aria-controls="promptPanel" data-component="CollapsibleTrigger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              <span id="promptLabel">프롬프트 추가하기</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
            </button>

            <div class="split" data-component="ButtonGroup">
              <button class="btn btn-ghost" id="copyBtn" data-component="Button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span id="copyLabel">복사하기</span>
              </button>
              <button class="btn btn-ghost" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="더 보기" data-component="DropdownMenuTrigger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="menu" id="menu" role="menu" hidden data-component="DropdownMenuContent">
                <button class="menu-item" role="menuitem" id="dlBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>마크다운 다운로드
                </button>
                <button class="menu-item" role="menuitem" id="gptBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.2 19.6 7.6v8.8L12 20.8 4.4 16.4V7.6Z"/><path d="M12 3.2v8.8m7.6-4.4L12 12m7.6 4.4L12 12m0 8.8V12m-7.6 4.4L12 12M4.4 7.6 12 12"/></svg>ChatGPT에서 열기
                </button>
                <button class="menu-item" role="menuitem" id="claudeBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4M7.5 3.7l9 16.6M16.5 3.7l-9 16.6"/></svg>Claude에서 열기

<script>
  /* ── dummy pages (product data, no network) ── */
  const PAGES = {
    short: {
      url: 'https://blog.hanbit-dev.kr/posts/markdown-for-llm-context',
      title: 'LLM에 웹 문서를 넘길 때 HTML 대신 Markdown을 쓰는 이유',
      author: '정다은',
      md: `웹 페이지를 통째로 복사해 LLM에 붙여넣으면 내비게이션, 쿠키 배너, 관련 글 목록까지 함께 들어갑니다. 모델은 그 잡음을 구분하느라 **토큰과 주의력**을 씁니다. 본문만 Markdown으로 정리해 넘기면 같은 질문에도 답이 짧고 정확해집니다.

## 무엇이 달라지나

지난달 팀 위키 문서 42건을 두 방식으로 넣어 비교했습니다.

| 입력 형식 | 평균 토큰 | 요약 정확도 |
| --- | --- | --- |
| 원본 HTML | 18,430 | 71% |
| 본문 Markdown | 4,912 | 88% |

토큰은 약 73% 줄었고, 사람이 매긴 요약 정확도는 17%p 올랐습니다.

## 실무 팁

1. 제목과 출처는 문서 맨 앞에 둡니다. 모델이 맥락을 먼저 잡습니다.
2. 표와 코드 블록은 그대로 유지합니다. Markdown은 구조를 잃지 않습니다.
3. 프롬프트는 문서 **앞에** 둡니다. "요약해줘"처럼 짧아도 충분합니다.

> 긴 문서라면 한 번에 넘기기보다 섹션별로 나눠 묻는 편이 결과가 안정적입니다.

추출에는 \`defuddle\` 같은 본문 추출기를 쓰면 편합니다.

\`\`\`bash
npx defuddle parse https://example.com/article --markdown
\`\`\`

더 자세한 비교는 [원문 실험 노트](https://blog.hanbit-dev.kr/notes/llm-input-bench)에 정리해 두었습니다.`
    },
    long: {
      url: 'https://en.wikipedia.org/wiki/Markdown',
      title: 'Markdown',
      author: 'Wikipedia',
      md: null
    },
    noauthor: {
      url: 'https://example.com',
      title: 'Example Domain',
      author: '',
      md: `This domain is for use in documentation examples without needing permission. Avoid use in operations.

[Learn more](https://iana.org/domains/example)`
    }
  };
  // long article: realistic sections repeated to well beyond the 8,000-char limit
  (() => {
    const sec = [
      ['History', 'Markdown was created in 2004 by John Gruber in collaboration with Aaron Swartz. Gruber wanted a format that read naturally as plain text and could be converted to structurally valid HTML. The key design goal was readability: a Markdown document should be publishable as-is, without looking like it has been marked up with tags or formatting instructions.'],
      ['Rise and divergence', 'As Markdown spread, implementations began to differ on edge cases such as nested lists, emphasis inside words, and how blank lines interact with HTML blocks. Sites like GitHub, Reddit, and Stack Exchange each added their own extensions, which made the same source render differently across platforms.'],
      ['Standardization', 'In 2014 a group of developers published CommonMark, an unambiguous specification with an extensive test suite. GitHub Flavored Markdown later became a strict superset of CommonMark, adding tables, task lists, strikethrough, and autolinks.'],
      ['Variants', 'Popular variants include MultiMarkdown, which adds footnotes and metadata; Markdown Extra, used by PHP projects; R Markdown, which embeds executable code chunks; and MDX, which allows JSX components inside Markdown documents.'],
      ['Implementations', 'Implementations exist for nearly every programming language. Common choices include cmark in C, markdown-it and marked in JavaScript, Python-Markdown and mistune in Python, and pulldown-cmark in Rust. Most static site generators ship with a Markdown parser built in.'],
      ['Use with language models', 'Large language models are frequently trained on Markdown-heavy corpora such as documentation and README files, and many chat interfaces render model output as Markdown. As a result, Markdown has become a common interchange format for feeding web content into prompts.']
    ];
    let md = '**Markdown** is a lightweight markup language for creating formatted text using a plain-text editor. It is widely used for README files, forum posts, documentation, and notes.\n\n';
    for (let round = 0; round < 4; round++) {
      sec.forEach(([h, p], i) => {
        md += `## ${round ? h + ' (' + ['continued', 'details', 'notes'][round - 1] + ')' : h}\n\n${p}\n\n`;
        if (i === 2 && round === 0) md += '| Year | Event |\n| --- | --- |\n| 2004 | Original Markdown.pl released |\n| 2014 | CommonMark spec published |\n| 2017 | GFM spec formalized |\n\n';
        if (i === 4 && round === 0) md += '```markdown\n# Heading\n\n- item one\n- item two\n\n[link](https://commonmark.org)\n```\n\n';
        if (i === 3 && round === 1) md += '- MultiMarkdown\n- Markdown Extra\n- R Markdown\n- MDX\n\n';
      });
    }
    PAGES.long.md = md.trim();
  })();

  /* ── tiny markdown renderer (prototype only) ── */
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  function render(md) {
    const lines = md.split('\n'); let out = ''; let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (l.startsWith('```')) { let code = ''; i++; while (i < lines.length && !lines[i].startsWith('```')) code += lines[i++] + '\n'; i++; out += `<pre><code>${esc(code)}</code></pre>`; continue; }
      if (/^###\s/.test(l)) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
      if (/^##\s/.test(l)) { out += `<h2>${inline(l.slice(3))}</h2>`; i++; continue; }
      if (l.startsWith('|')) { const rows = []; while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]); const cells = r => r.split('|').slice(1, -1).map(c => c.trim()); out += '<table><thead><tr>' + cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' + rows.slice(2).map(r => '<tr>' + cells(r).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'; continue; }
      if (/^- /.test(l)) { let li = ''; while (i < lines.length && /^- /.test(lines[i])) li += `<li>${inline(lines[i++].slice(2))}</li>`; out += `<ul>${li}</ul>`; continue; }
      if (/^\d+\. /.test(l)) { let li = ''; while (i < lines.length && /^\d+\. /.test(lines[i])) li += `<li>${inline(lines[i++].replace(/^\d+\. /, ''))}</li>`; out += `<ol>${li}</ol>`; continue; }
      if (l.startsWith('> ')) { out += `<blockquote><p>${inline(l.slice(2))}</p></blockquote>`; i++; continue; }
      if (!l.trim()) { i++; continue; }
      let p = l; i++; while (i < lines.length && lines[i].trim() && !/^(#|\||- |\d+\. |> |```)/.test(lines[i])) p += ' ' + lines[i++];
      out += `<p>${inline(p)}</p>`;
    }
    return out;
  }

  /* ── product behavior ── */
  const $ = id => document.getElementById(id);
  const LIMIT = 8000;
  let page = null, loadingTimer = null;

  function doc(p) {
    return `# ${p.title}\n\n> 출처: ${p.url}` + (p.author ? `\n> 저자: ${p.author}` : '') + `\n\n${p.md}\n`;
  }
  function selectedChip() { return document.querySelector('#prompts [aria-pressed="true"]') }
  function promptText() {
    const c = selectedChip(); if (!c) return '';
    return c.dataset.prompt === '__custom' ? $('customPrompt').value.trim() : c.dataset.prompt;
  }
  function syncPromptLabel() {
    const p = promptText();
    $('promptLabel').innerHTML = p ? `프롬프트: <span class="chosen">${esc(p.length > 24 ? p.slice(0, 24) + '…' : p)}</span>` : '프롬프트 추가하기';
  }
  function view(which) {
    ['idle', 'loading', 'error', 'result'].forEach(k => $(k).hidden = k !== which);
  }
  function setLoading(on) {
    $('convertBtn').disabled = on; $('url').readOnly = on;
    $('spin').toggleAttribute('hidden', !on); $('icoArrow').toggleAttribute('hidden', on);
    $('convertBtn').setAttribute('aria-label', on ? '변환 중' : '변환');
  }
  function closeMenu() { $('menu').hidden = true; $('menuBtn').setAttribute('aria-expanded', 'false'); }
  function showResult(p) {
    page = p; closeMenu();
    $('rTitle').textContent = p.title || new URL(p.url).hostname;
    $('rBy').textContent = p.author ? `By ${p.author}` : ''; $('rBy').hidden = !p.author;
    $('rBody').innerHTML = render(p.md);
    view('result');
  }
  function showError(title, desc) {
    $('errTitle').textContent = title; $('errDesc').textContent = desc; view('error');
  }
  function resetPrompt() {
    document.querySelectorAll('#prompts .chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
    $('customPrompt').value = ''; $('customPrompt').hidden = true;
    $('promptPanel').hidden = true; $('promptToggle').setAttribute('aria-expanded', 'false');
    syncPromptLabel();
  }
  function setInvalid(on) {
    $('urlErr').hidden = !on;
    if (on) { $('urlBox').setAttribute('data-invalid', ''); $('url').setAttribute('aria-invalid', 'true'); }
    else { $('urlBox').removeAttribute('data-invalid'); $('url').removeAttribute('aria-invalid'); }
  }
  function resetAll() {
    clearTimeout(loadingTimer); setLoading(false);
    $('url').value = ''; setInvalid(false);
    $('clearBtn').hidden = true; resetPrompt(); page = null; view('idle');
    prototypeShell.setState('Default'); $('url').focus();
  }

  $('url').addEventListener('input', () => { $('clearBtn').hidden = !$('url').value; setInvalid(false); });
  $('clearBtn').onclick = resetAll;
  $('form').onsubmit = e => {
    e.preventDefault();
    const v = $('url').value.trim();
    if (!/^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(v)) { setInvalid(true); return; }
    resetPrompt(); setLoading(true); view('loading');
    loadingTimer = setTimeout(() => {
      setLoading(false);
      if (/nonexistent|404|invalid-host/.test(v)) { prototypeShell.setState('가져오기 실패'); fillFetchError(v); return; }
      if (/\.pdf($|\?)/i.test(v)) { prototypeShell.setState('Default'); showError('HTML 페이지가 아닙니다', '이 주소는 PDF 파일을 돌려줍니다. 웹 페이지(HTML) 주소만 변환할 수 있습니다.'); return; }
      if (/empty|spa\./.test(v)) { prototypeShell.setState('Default'); showError('본문을 찾지 못했습니다', '페이지에서 추출할 본문이 없습니다. JavaScript로 내용을 그리는 페이지라면 변환되지 않을 수 있습니다.'); return; }
      if (/wikipedia/.test(v)) { prototypeShell.setState('긴 본문 결과'); showResult(PAGES.long); return; }
      if (/example\.com\/?$/.test(v)) { prototypeShell.setState('Default'); showResult(PAGES.noauthor); return; }
      prototypeShell.setState('변환 결과'); showResult({ ...PAGES.short, url: v });
    }, 900);
  };
  function fillFetchError(v) {
    showError('페이지를 가져오지 못했습니다', `${v.replace(/^https?:\/\//, '')} 에 연결하지 못했습니다(응답 없음). 주소가 맞는지 확인한 뒤 다시 시도해 주세요.`);
  }

  // prompt collapsible + chips (click a selected chip again to clear it)
  $('promptToggle').onclick = () => {
    const open = $('promptPanel').hidden;
    $('promptPanel').hidden = !open; $('promptToggle').setAttribute('aria-expanded', open);
  };
  $('prompts').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const wasOn = b.getAttribute('aria-pressed') === 'true';
    document.querySelectorAll('#prompts .chip').forEach(x => x.setAttribute('aria-pressed', !wasOn && x === b));
    const custom = !wasOn && b.dataset.prompt === '__custom';
    $('customPrompt').hidden = !custom;
    if (custom) $('customPrompt').focus(); else $('customPrompt').value = '';
    syncPromptLabel();
  });
  $('customPrompt').addEventListener('input', syncPromptLabel);

  // split button + menu
  $('menuBtn').onclick = e => {
    e.stopPropagation();
    const open = $('menu').hidden;
    $('menu').hidden = !open; $('menuBtn').setAttribute('aria-expanded', open);
    if (open) $('menu').querySelector('.menu-item').focus();
  };
  document.addEventListener('click', e => { if (!e.target.closest('.split')) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('menu').hidden) { closeMenu(); $('menuBtn').focus(); } });

  // toasts
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  function toast(title, desc, icon = ICON_OK, ms = 2600, cls = '') {
    const t = document.createElement('div'); t.className = 'toast ' + cls;
    t.innerHTML = icon + `<div><b>${esc(title)}</b>${desc ? esc(desc) : ''}</div>`;
    $('toaster').append(t); setTimeout(() => t.remove(), ms);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
  }

  $('copyBtn').onclick = async () => {
    if (await copy(doc(page))) {
      $('copyLabel').textContent = '복사했습니다';
      setTimeout(() => $('copyLabel').textContent = '복사하기', 1600);
    } else toast('복사하지 못했습니다', '브라우저가 클립보드 접근을 막았습니다.', ICON_ERR, 3200, 'error');
  };
  $('dlBtn').onclick = () => {
    closeMenu();
    const name = (page.title || '').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '-').slice(0, 80) || 'page';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([doc(page)], { type: 'text/markdown' }));
    a.download = name + '.md'; a.click(); URL.revokeObjectURL(a.href);
    toast(`${name}.md 파일을 내려받았습니다`, '');
  };
  async function openLLM(service) {
    closeMenu();
    const name = service === 'gpt' ? 'ChatGPT' : 'Claude';
    const p = promptText();
    const text = (p ? p + '\n\n' : '') + doc(page);
    // prototype: no new tab is actually opened (no network)
    if (encodeURIComponent(text).length <= LIMIT) {
      toast(`${name}를 새 탭에서 열었습니다`, p ? `"${p}" 프롬프트와 본문을 함께 넘겼습니다.` : '본문을 입력란에 채워 넘겼습니다.');
    } else if (await copy(text)) {
      toast('본문이 길어 클립보드에 복사했습니다', `새 탭의 ${name} 입력란에 붙여넣기(Ctrl+V / ⌘V) 하세요.`, ICON_INFO, 6000);
    } else {
      toast('복사하지 못해 열지 않았습니다', '브라우저가 클립보드 접근을 막았습니다. 복사하기로 직접 복사해 주세요.', ICON_ERR, 4000, 'error');
    }
  }
  $('gptBtn').onclick = () => openLLM('gpt');
  $('claudeBtn').onclick = () => openLLM('claude');

  // product dark-mode toggle (mirrors the shell theme classes)
  function syncThemeIcon() {
    const dark = document.documentElement.classList.contains('sh-theme-dark');
    $('icoMoon').toggleAttribute('hidden', dark); $('icoSun').toggleAttribute('hidden', !dark);
    $('themeBtn').setAttribute('aria-label', dark ? '라이트 모드로 전환' : '다크 모드로 전환');
  }
  $('themeBtn').onclick = () => {
    const dark = document.documentElement.classList.contains('sh-theme-dark');
    document.querySelector(`#sh-theme [data-theme="${dark ? 'light' : 'dark'}"]`).click();
  };
  new MutationObserver(syncThemeIcon).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
</script>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => { applyState(stateSelect.value); presetEnter(stateSelect.value); };

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  // preset entry for the converter screen (forced data)
  function presetEnter(name) {
    const set = (url) => { $('url').value = url; $('clearBtn').hidden = false; $('url').removeAttribute('aria-invalid'); $('urlErr').hidden = true; resetPrompt(); };
    if (name === '변환 결과') { set(PAGES.short.url); showResult(PAGES.short); }
    else if (name === '긴 본문 결과') { set(PAGES.long.url); showResult(PAGES.long); }
    else if (name === '가져오기 실패') { const u = 'https://nonexistent-blog.dev/post/1'; set(u); fillFetchError(u); }
    else { $('url').value = ''; $('clearBtn').hidden = true; resetPrompt(); page = null; view('idle'); }
  }

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
